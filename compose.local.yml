# Local databases for SETUP.md: uniAuth's and Uniloom's PostgreSQL, reachable only from this
# computer. Start with `bun run db:local` (safe to run again); the data stays in the volumes.
name: unicorp-local

services:
  uniauth-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: uniauth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - uniauth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d uniauth"]
      interval: 2s
      timeout: 5s
      retries: 30

  uniloom-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: uniloom
      POSTGRES_USER: uniloom
      POSTGRES_PASSWORD: uniloom
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - uniloom_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uniloom -d uniloom"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  uniauth_data:
  uniloom_data:
