services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: uniloom
      POSTGRES_USER: uniloom
      POSTGRES_PASSWORD: uniloom
    ports:
      # Loopback by default. On the Oracle VM, `bun run db:up` sets DB_HOST_IP to the VM's
      # Tailscale IP, so only devices on the tailnet can reach it, never the internet.
      - "${DB_HOST_IP:-127.0.0.1}:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uniloom -d uniloom"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies Prisma migrations once, then exits. The API starts after it succeeds.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["bun", "run", "--cwd", "apps/api", "db:deploy"]
    environment:
      DATABASE_URL: postgresql://uniloom:uniloom@db:5432/uniloom
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://uniloom:uniloom@db:5432/uniloom
      PORT: 3011
    ports:
      - "127.0.0.1:3011:3011"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3011/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        API_URL: http://api:3011
    restart: unless-stopped
    environment:
      API_URL: http://api:3011
    ports:
      - "127.0.0.1:3013:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
