name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Generation-only jobs need a URL, but only integration tests connect to PostgreSQL.
env:
  DATABASE_URL: postgresql://uniloom:uniloom@localhost:5432/uniloom

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: github.actor != 'unishare-release-bot[bot]'
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run api:generate
      - run: bun run lint

  typecheck:
    name: Typecheck & OpenAPI
    runs-on: ubuntu-latest
    if: github.actor != 'unishare-release-bot[bot]'
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      # Reject a stale committed contract before generating the browser hooks.
      - run: bun run api:spec
      - run: git diff --exit-code apps/web/openapi.json
      - run: bun run api:generate
      - run: bun run typecheck

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    if: github.actor != 'unishare-release-bot[bot]'
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run test

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    if: github.actor != 'unishare-release-bot[bot]'
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: uniloom
          POSTGRES_USER: uniloom
          POSTGRES_PASSWORD: uniloom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uniloom -d uniloom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run --cwd apps/api db:deploy
      - run: bun run --cwd apps/api test:e2e

  build:
    name: Build
    runs-on: ubuntu-latest
    if: github.actor != 'unishare-release-bot[bot]'
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      # The web build generates its browser hooks before compiling.
      - run: bun run build
