name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  check:
    name: Lint, test & build
    runs-on: ubuntu-latest
    if: github.actor != 'unishare-release-bot[bot]'
    env:
      DATABASE_URL: postgresql://uniloom:uniloom@localhost:5432/uniloom
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: uniloom
          POSTGRES_USER: uniloom
          POSTGRES_PASSWORD: uniloom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uniloom -d uniloom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run --cwd apps/api db:deploy
      # The committed OpenAPI spec must match the API; regenerate with `bun run api:spec`.
      - run: bun run api:spec
      - run: git diff --exit-code apps/web/openapi.json
      # The web app's typed client is generated from it, not committed.
      - run: bun run api:generate
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run --cwd apps/api test:e2e
      - run: bun run build
